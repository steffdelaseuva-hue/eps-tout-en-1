<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EBD27E"/><stop offset=".22" stop-color="#C9A227"/><stop offset=".42" stop-color="#8E6F1C"/>
      <stop offset=".62" stop-color="#2F6BD8"/><stop offset="1" stop-color="#0B2A5B"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".25" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="ball" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF3C4"/><stop offset=".5" stop-color="#E6C76E"/><stop offset="1" stop-color="#B8912A"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#061433" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- piste d'athlétisme -->
  <g fill="none" stroke="#fff" stroke-linecap="round">
    <path d="M-40 930 Q512 700 1064 930" stroke-width="16" opacity=".22"/>
    <path d="M-40 1010 Q512 770 1064 1010" stroke-width="16" opacity=".16"/>
    <path d="M-40 850 Q512 630 1064 850" stroke-width="16" opacity=".28"/>
  </g>
  <!-- traits de vitesse -->
  <g stroke="#fff" stroke-linecap="round" stroke-width="22" opacity=".45">
    <path d="M20 560h60"/><path d="M10 620h70"/><path d="M30 680h50"/>
  </g>
  <!-- obstacle (bloc) -->
  <rect x="150" y="690" width="270" height="112" rx="18" fill="#F4E7B5" filter="url(#sh)"/>
  <rect x="150" y="690" width="270" height="24" rx="12" fill="#fff" opacity=".6"/>
  <!-- traceur : passement au-dessus du bloc, une main posée -->
  <g filter="url(#sh)" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="54">
    <path d="M250 536 L226 604"/>
    <path d="M252 552 L284 618 L298 676"/>
    <path d="M244 548 L190 512 L140 528"/>
    <path d="M226 604 L318 566 L410 548"/>
    <path d="M226 604 L316 604 L402 598"/>
  </g>
  <circle cx="266" cy="474" r="48" fill="#fff" filter="url(#sh)"/>
  <!-- joueur en suspension qui arme un tir -->
  <g transform="translate(345 70) scale(.74)"><g filter="url(#sh)" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="72">
    <path d="M548 392 L468 598"/>
    <path d="M540 410 L650 350 L716 238"/>
    <path d="M530 430 L430 450 L372 530"/>
    <path d="M468 598 L584 676 L552 800"/>
    <path d="M468 598 L372 706 L276 668"/>
  </g>
  <circle cx="584" cy="296" r="68" fill="#fff" filter="url(#sh)"/>
  <g filter="url(#sh)">
    <circle cx="752" cy="170" r="76" fill="url(#ball)"/>
    <g fill="none" stroke="#8E6F1C" stroke-width="9" stroke-linecap="round" opacity=".7">
      <path d="M684 140 Q752 190 822 150"/><path d="M700 222 Q740 160 800 104"/></g>
  </g></g>
</svg>
